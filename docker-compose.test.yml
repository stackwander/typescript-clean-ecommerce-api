name: backendcleants-tests
services:
  mongo-test:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27018:27017']
    tmpfs: [/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { rs.status() } catch (e) { if (e.codeName !== "NotYetInitialized") throw e; rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 3s
      timeout: 10s
      retries: 40
