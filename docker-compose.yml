name: backendcleants
x-api: &api
  image: backendcleants:local
  build: .
  init: true
  restart: unless-stopped
  environment:
    NODE_ENV: production
    PORT: 3000
    MONGODB_URL: mongodb://mongo:27017/shop?replicaSet=rs0&maxPoolSize=10&serverSelectionTimeoutMS=5000
    API_READ_KEY: ${API_READ_KEY:?Generate API_READ_KEY with npm run keys}
    API_WRITE_KEY: ${API_WRITE_KEY:?Generate API_WRITE_KEY with npm run keys}
    API_ADMIN_KEY: ${API_ADMIN_KEY:?Generate API_ADMIN_KEY with npm run keys}
    CURRENCY: ${CURRENCY:-USD}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
  depends_on:
    schema:
      condition: service_completed_successfully
  networks: [private]
  stop_grace_period: 25s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    networks: [private, edge]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo: { condition: service_healthy }
    networks: [private]
    entrypoint: [bash, -ec]
    command:
      - |
        mongosh --host mongo --quiet --eval 'try { rs.status() } catch (e) { if (e.codeName !== "NotYetInitialized") throw e; rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'
        for i in {1..60}; do
          if mongosh --host mongo --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
          sleep 1
        done
        exit 1
  schema:
    build: { context: ., target: tooling }
    image: backendcleants:tooling
    environment:
      MONGODB_URL: mongodb://mongo:27017/shop?replicaSet=rs0
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    networks: [private]
    command: [npm, run, 'db:push']
  backendapi1: *api
  backendapi2: *api
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_ACCESS_LOG: 'off'
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ['127.0.0.1:8000:8000']
    volumes: [./kong.yml:/etc/kong/kong.yml:ro]
    depends_on:
      backendapi1: { condition: service_healthy }
      backendapi2: { condition: service_healthy }
    networks: [private, edge]
    logging: *logging
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [monitoring]
    ports: ['127.0.0.1:9090:9090']
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    networks: [private, edge]
    logging: *logging
  loki:
    image: grafana/loki:3.4.2
    profiles: [monitoring]
    command: [-config.file=/etc/loki/config.yml]
    volumes: [./loki-config.yml:/etc/loki/config.yml:ro, loki-data:/loki]
    networks: [private]
    logging: *logging
  alloy:
    image: grafana/alloy:v1.8.3
    profiles: [monitoring]
    command: [run, /etc/alloy/config.alloy]
    environment:
      ALLOY_DOCKER_LABEL: com.docker.compose.project=${COMPOSE_PROJECT_NAME:-backendcleants}
    # Docker socket access is privileged; enable this optional local collector only on trusted hosts.
    volumes:
      [
        ./monitoring/config.alloy:/etc/alloy/config.alloy:ro,
        /var/run/docker.sock:/var/run/docker.sock:ro,
      ]
    networks: [private]
    depends_on: [loki]
    logging: *logging
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [monitoring]
    ports: ['127.0.0.1:4000:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Generate GRAFANA_ADMIN_PASSWORD with npm run keys}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      [
        grafana-data:/var/lib/grafana,
        ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/sources.yml:ro,
      ]
    networks: [private, edge]
    logging: *logging
networks:
  private: { internal: true }
  edge: {}
volumes:
  mongo-data:
  prometheus-data:
  loki-data:
  grafana-data:
