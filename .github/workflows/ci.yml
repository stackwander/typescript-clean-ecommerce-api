name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run docs:generate && git diff --exit-code -- docs/openapi.json
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: npm run test:integration
        env:
          TEST_MONGODB_URL: mongodb://127.0.0.1:27018/shop_test?replicaSet=rs0&directConnection=true&serverSelectionTimeoutMS=5000
      - run: docker build --target runtime -t backendcleants:ci .
      - if: always()
        run: docker compose -f docker-compose.test.yml down
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
