_format_version: '3.0'
services:
  - name: shop-api
    host: shop-api
    port: 3000
    routes:
      - name: api
        paths: [/api, /health]
        strip_path: false
        methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
upstreams:
  - name: shop-api
    targets:
      - target: backendapi1:3000
        weight: 100
      - target: backendapi2:3000
        weight: 100
    healthchecks:
      active:
        http_path: /health/ready
        healthy: { interval: 10, successes: 1 }
        unhealthy: { interval: 5, http_failures: 3, tcp_failures: 3, timeouts: 3 }
plugins:
  - name: rate-limiting
    config: { minute: 240, policy: local, fault_tolerant: false }
  - name: prometheus
    config: { latency_metrics: true, status_code_metrics: true, upstream_health_metrics: true }
